name: Build Android APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'My App'
      web_url:
        description: 'Website URL'
        required: true
        default: 'https://example.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Info
        run: |
          echo "Building APK for App: ${{ github.event.client_payload.app_name || inputs.app_name }}"
          echo "Website URL: ${{ github.event.client_payload.web_url || inputs.web_url }}"
          
      - name: Success Message
        run: echo "Workflow triggered successfully!"
